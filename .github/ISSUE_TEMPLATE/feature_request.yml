name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us what you want and why.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Describe your use case.
      placeholder: "I want to deploy to 5 phones at once, but currently I have to run the script 5 times manually..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see? Be as specific as possible.
      placeholder: "A `deploy-all.sh` script that reads a hosts.txt file and deploys in parallel..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds have you tried?
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - "Single device"
        - "Multi-device / fleet"
        - "Documentation"
        - "Tooling / CI"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
