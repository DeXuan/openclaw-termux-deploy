name: Smoke Test

on:
  push:
    paths:
      - '**.sh'
      - '**.py'
      - 'openclaw-deploy'
      - 'install.sh'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.py'
      - 'openclaw-deploy'
      - 'install.sh'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax check (all .sh files)
        run: |
          echo "=== bash -n 语法检查 ==="
          FAIL=0
          for f in $(find . -name "*.sh" -not -path "./.git/*"); do
            bash -n "$f" 2>&1 || { echo "FAIL: $f"; FAIL=1; }
          done
          # openclaw-deploy 无后缀但也需要检查
          bash -n openclaw-deploy 2>&1 || { echo "FAIL: openclaw-deploy"; FAIL=1; }
          if [ $FAIL -eq 0 ]; then echo "All bash syntax OK"; fi
          exit $FAIL

      - name: Python compile check
        run: |
          echo "=== python3 -m py_compile ==="
          FAIL=0
          for f in $(find . -name "*.py" -not -path "./.git/*"); do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>&1 || { echo "FAIL: $f"; FAIL=1; }
          done
          if [ $FAIL -eq 0 ]; then echo "All python compile OK"; fi
          exit $FAIL

      - name: Install script consistency check
        run: |
          echo "=== 安装脚本关键逻辑一致性检查 ==="
          FAIL=0
          CANONICAL="install.sh scripts/phone_install_openclaw.sh scripts/phone_setup_service.sh"

          # 1. GYP_DEFINES 变量必须一致 (仅安装脚本需要，setup 不跑 npm install)
          echo "--- 1. GYP_DEFINES ---"
          for f in install.sh scripts/phone_install_openclaw.sh; do
            if grep -q 'GYP_DEFINES="android_ndk_path="' "$f" 2>/dev/null; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f 缺少 GYP_DEFINES!"
              FAIL=1
            fi
          done

          # 2. NODE_OPTIONS IPv4 必须一致
          echo "--- 2. NODE_OPTIONS ipv4first ---"
          for f in install.sh scripts/phone_setup_service.sh scripts/runit-service_openclaw_run; do
            if grep -q 'dns-result-order=ipv4first' "$f" 2>/dev/null; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f 缺少 --dns-result-order=ipv4first!"
              FAIL=1
            fi
          done

          # 3. npm install --allow-scripts 包列表一致
          echo "--- 3. npm --allow-scripts packages ---"
          EXPECTED="openclaw,@google/genai,protobufjs,tree-sitter-bash"
          for f in install.sh scripts/phone_install_openclaw.sh; do
            if grep -q "$EXPECTED" "$f" 2>/dev/null; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f --allow-scripts 包列表与预期不一致!"
              FAIL=1
            fi
          done

          # 4. runit run 脚本 exec node 模式一致（含变量引用 $OCMJS/$OPENCLAW_MJS）
          echo "--- 4. runit exec node pattern ---"
          for f in install.sh scripts/phone_setup_service.sh scripts/runit-service_openclaw_run; do
            if grep -qE 'exec.*node.*(openclaw\.mjs|\$OCMJS|\$OPENCLAW_MJS).*gateway' "$f" 2>/dev/null; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f 缺少 exec node ... gateway 模式!"
              FAIL=1
            fi
          done

          # 5. shebang wrapper 修复模式一致 (symlink→bash wrapper)
          echo "--- 5. shebang wrapper pattern ---"
          for f in install.sh scripts/phone_setup_service.sh; do
            if grep -qE 'cat >.*OPENCLAW_BIN.*<<|\#\!/data/data/com\.termux' "$f" 2>/dev/null; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f 缺少 bash wrapper 修复模式!"
              FAIL=1
            fi
          done

          # 6. skill/scripts/ 副本与 scripts/ 同步
          echo "--- 6. skill/scripts/ sync ---"
          for f in phone_check_env.sh phone_install_openclaw.sh phone_setup_service.sh; do
            if diff -q "scripts/$f" "skill/scripts/$f" >/dev/null 2>&1; then
              echo "  ✓ scripts/$f == skill/scripts/$f"
            else
              echo "  ✗ scripts/$f != skill/scripts/$f — 请同步!"
              FAIL=1
            fi
          done

          if [ $FAIL -eq 0 ]; then echo "All consistency checks passed"; fi
          exit $FAIL

      - name: ShellCheck (warning level, full coverage)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
