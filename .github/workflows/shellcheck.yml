name: ShellCheck

on:
  push:
    paths:
      - '**.sh'
      - 'openclaw-deploy'
      - 'install.sh'
      - 'lib/**'
      - 'scripts/**'
      - 'bailian-quota-switcher/scripts/**'
  pull_request:
    paths:
      - '**.sh'
      - 'openclaw-deploy'
      - 'install.sh'
      - 'lib/**'
      - 'scripts/**'
      - 'bailian-quota-switcher/scripts/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            skill-formatter
          severity: error
