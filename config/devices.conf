DEV_HERMES_K60="v0.19.0"
DEV_HERMES_NOTE7="v0.19.0"
DEV_HERMES_MIX2S="v0.19.0"
DEV_HERMES_NOTE4X="—"

# ── 自愈监控配对 ──
# 格式: HEALTHCHECK_TARGET_<NAME>="user@host:port sleep_sec ssh_fail_alert"
HEALTHCHECK_TARGET_K60="u0_a171@100.91.94.44:8022 20 1"     # K60→Note7
HEALTHCHECK_TARGET_NOTE7="u0_a129@100.118.60.29:8022 20 1"   # Note7→K60
HEALTHCHECK_TARGET_MIX2S="u0_a129@100.118.60.29:8022 25 1"   # MIX2S→K60
HEALTHCHECK_TARGET_NOTE4X="u0_a129@192.168.1.23:8022 30 0"   # Note4X→K60(LAN,静默)

# ── 设备列表（用于循环遍历）──
FLEET_DEVICES=("K60" "Note7" "MIX2S" "Note4X")
